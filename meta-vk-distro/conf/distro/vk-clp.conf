require conf/distro/vk-bsp.conf

DISTRO = "vk-clp"
DISTROOVERRIDES = "poky:vk-bsp:vk-clp"

IMAGE_FEATURES:append = " vk-clp-tools ssh-server-openssh"

FEATURE_PACKAGES_vk-clp-tools = " \
	packagegroup-vk-clp-tools-base \
	packagegroup-vk-clp-tools-utils \
"

# meta-browser/meta-chromium provides gn-native_132.0.6834.83 (priority 7) which
# would otherwise outrank meta-qt6's gn-native_6.8.3, causing qtwebengine configure
# to fail with "No gn found for cross-compilation". Chromium uses chromium-gn-native
# (see meta-vkboards recipes-browser bbappends) to get its own GN version.
PREFERRED_VERSION_gn-native = "6.8.3%"
